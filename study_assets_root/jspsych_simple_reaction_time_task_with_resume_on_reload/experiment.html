<!DOCTYPE html>
<html>

<head>
  <title>jsPsych Simple Reaction Time Task with Resume after Reloading</title>
  <script src="jatos.js"></script>
  <script src="jspsych/jspsych.js"></script>
  <script src="jspsych/plugin-html-keyboard-response.js"></script>
  <script src="jspsych/plugin-image-keyboard-response.js"></script>
  <script src="jspsych/plugin-preload.js"></script>
  <link href="jspsych/jspsych.css" rel="stylesheet" type="text/css" />
</head>

<body></body>
<script>
  const repetitions = 10; // total number of repetitions
  let resultData = []; // intermediate result data

  /* initialize jsPsych */
  var jsPsych = initJsPsych({
    on_trial_start: jatos.addAbortButton,
    on_finish: () => jatos.endStudy(jatos.studySessionData.resultData)
  });

  /* create timeline */
  var timeline = [];

  /* preload images */
  var preload = {
    type: jsPsychPreload,
    images: ['img/blue.png', 'img/orange.png']
  };

  /* define welcome message trial */
  var welcome = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: "Welcome to the experiment. Press any key to begin."
  };

  /* define message trial if experiment was reloaded */
  function resume() {
    return {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `Welcome back to the experiment. You still have ${getRepetitionsToGo()} of ${repetitions} repetitions to go. Press any key to continue.`
    }
  };

  /* define instructions trial */
  var instructions = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
        <p>In this experiment, a circle will appear in the center 
        of the screen.</p><p>If the circle is <strong>blue</strong>, 
        press the letter F on the keyboard as fast as you can.</p>
        <p>If the circle is <strong>orange</strong>, press the letter J 
        as fast as you can.</p>
        <div style='width: 700px;'>
        <div style='float: left;'><img src='img/blue.png'></img>
        <p class='small'><strong>Press the F key</strong></p></div>
        <div style='float: right;'><img src='img/orange.png'></img>
        <p class='small'><strong>Press the J key</strong></p></div>
        </div>
        <p>Press any key to begin.</p>
      `,
    post_trial_gap: 2000
  };

  /* define trial stimuli array for timeline variables */
  var test_stimuli = [
    { stimulus: "img/blue.png", correct_response: 'f' },
    { stimulus: "img/orange.png", correct_response: 'j' }
  ];

  /* define fixation and test trials */
  var fixation = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '<div style="font-size:60px;">+</div>',
    choices: "NO_KEYS",
    trial_duration: function () {
      return jsPsych.randomization.sampleWithoutReplacement([250, 500, 750, 1000, 1250, 1500, 1750, 2000], 1)[0];
    },
    data: {
      task: 'fixation'
    }
  };

  var test = {
    type: jsPsychImageKeyboardResponse,
    stimulus: jsPsych.timelineVariable('stimulus'),
    choices: ['f', 'j'],
    data: {
      task: 'response',
      correct_response: jsPsych.timelineVariable('correct_response')
    },
    on_finish: function (data) {
      data.correct = jsPsych.pluginAPI.compareKeys(data.response, data.correct_response);
      resultData.push(data);
      // Save resultData to JATOS study session data every time we reach a multiple of the number of test stimuli (each repetition)
      if (resultData.length % test_stimuli.length === 0) {
        jatos.studySessionData.resultData.push(...resultData);
        jatos.setStudySessionData(jatos.studySessionData);
        resultData = []; // reset resultData after saving
      }
    }
  };

  /* define test procedure */
  function generateTestProcedure() {
    return {
      timeline: [fixation, test],
      timeline_variables: test_stimuli,
      repetitions: getRepetitionsToGo(),
      randomize_order: true
    }
  };

  /* define debrief */
  var debrief_block = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: function () {

      var trials = jsPsych.data.get().filter({ task: 'response' });
      var correct_trials = trials.filter({ correct: true });
      var accuracy = Math.round(correct_trials.count() / trials.count() * 100);
      var rt = Math.round(correct_trials.select('rt').mean());

      return `<p>You responded correctly on ${accuracy}% of the trials.</p>
          <p>Your average response time was ${rt}ms.</p>
          <p>Press any key to complete the experiment. Thank you!</p>`;
    }
  };

  /* function to calculate remaining repetitions */
  function getRepetitionsToGo() {
    return repetitions - (jatos.studySessionData.resultData.length / test_stimuli.length);
  }

  jatos.onLoad(() => {
    /* start the experiment */
    timeline.push(preload);

    if (jatos.studySessionData.resultData === undefined || jatos.studySessionData.resultData.length === 0) {
      // start a new run
      jatos.studySessionData.resultData = [];
      timeline.push(welcome);
      timeline.push(instructions);
    } else {
      // continue past run
      timeline.push(resume());
    }

    timeline.push(generateTestProcedure());
    timeline.push(debrief_block);
    jsPsych.run(timeline);
  });

</script>

</html>
