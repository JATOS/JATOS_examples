        // Protects the global jatos API and coexistence with a study's own jQuery.
        function testGlobalAndJQueryContracts() {
            testVar(window.jatosPreInitContract.windowJatosExists,
                "window.jatos exists immediately after loading jatos.js", true);
            testVar(window.jatosPreInitContract.globalAndWindowJatosAreIdentical,
                "global jatos and window.jatos are identical", true);
            testVar(window.jQuery === window.studyJQueryBeforeJatos,
                "jatos.js preserves the study's window.jQuery", true);
            testVar(window.$ === window.studyDollarBeforeJatos,
                "jatos.js preserves the study's window.$", true);
            const slim = window.jatosExpectedSlim ??
                [...document.scripts].some(script => /\/jatos-slim(?:\.min)?\.js(?:\?|$)/.test(script.src));
            if (slim) {
                testVar("jQuery" in jatos, "slim build omits jatos.jQuery", false);
            } else {
                testVar(typeof jatos.jQuery, "standard build provides jatos.jQuery", "function");
                testVar(jatos.jQuery?.fn?.jquery, "bundled jQuery version", "3.7.1");
                testVar(jatos.jQuery?.ajaxSettings?.cache, "bundled jQuery preserves cache setting", true);
                testVar(jatos.jQuery !== window.studyJQueryBeforeJatos,
                    "jatos.jQuery is isolated from the study's jQuery", true);
            }

        // Records that onLoad callbacks registered after initialization run synchronously.
        function testLateOnLoad() {
            const events = ["before"];
            jatos.onLoad(() => events.push("callback"));
            events.push("after");
            testVarJson(events, "late jatos.onLoad callback timing",
                '["before","callback","after"]');

        // Confirms that study assets load through both absolute and relative URLs.
        async function testStudyAssetImages() {
            const absoluteImage = document.getElementById("imgAbsolutePath");
            const relativeImage = document.getElementById("imgRelativePath");
            absoluteImage.src = jatos.urlBasePath + "study_assets/jatosjs_test_study_你经常来吗/media/你经常来这吗.png";
            relativeImage.src = "media/你经常来这吗.png";

            try {
                await Promise.all([
                    waitForImage(absoluteImage),
                    waitForImage(relativeImage)
                ]);
                testVar(absoluteImage.naturalWidth > 0, "absolute-path study asset loaded", true);
                testVar(relativeImage.naturalWidth > 0, "relative-path study asset loaded", true);
            } catch (error) {
                addFail("study asset images load", error);
            }
        }

        function waitForImage(image) {
            if (image.complete) {
                return image.naturalWidth > 0
                    ? Promise.resolve()
                    : Promise.reject(new Error(`Image failed to load: ${image.src}`));
            }
            return new Promise((resolve, reject) => {
                image.addEventListener("load", resolve, { once: true });
                image.addEventListener("error",
                    () => reject(new Error(`Image failed to load: ${image.src}`)),
                    { once: true });
            });
        }

        // Reports a check by comparing a value with its expected JSON representation.
        function testVarJson(variable, name, value, className = "test") {
            if (typeof value == 'undefined' && typeof variable == 'undefined') {
                addFail(name, "Value is undefined", className);
            } else if (typeof value != 'undefined' && value !== JSON.stringify(variable)) {
                addFail(name, `Expected ${value}, got ${JSON.stringify(variable)}`, className);
            } else {
                addSuccess(name, className);
            }
        }

        // Reports a check using strict equality or definedness if no expectation is given.
        function testVar(variable, name, value) {
            if (typeof value == 'undefined' && typeof variable == 'undefined') {
                addFail(name, "Value is undefined");
            } else if (typeof value != 'undefined' && value !== variable) {
                addFail(name, `Expected ${value}, got ${variable}`);
            } else {
                addSuccess(name);
            }
        }

        // Reports whether two arrays contain the same values regardless of order.
        function testArrayEqualityIgnoringOrder(actual, expected, name) {
            if (!Array.isArray(actual)) {
                addFail(name, `Expected an array, got ${JSON.stringify(actual)}`);
                return;
            }

            const sortedActual = [...actual].sort();
            const sortedExpected = [...expected].sort();
            if (JSON.stringify(sortedActual) !== JSON.stringify(sortedExpected)) {
                addFail(name, `Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
            } else {
                addSuccess(name);
            }
        }

        // Reports whether two JSON-compatible objects have equal serialized content.
        function testObjectEquality(obj1, obj2, name) {
            if (typeof obj1 == 'undefined' || typeof obj2 == 'undefined') {
                addFail(name, "One or both values are undefined");
            } else if (JSON.stringify(obj1) !== JSON.stringify(obj2)) {
                addFail(name, `Expected ${JSON.stringify(obj2)}, got ${JSON.stringify(obj1)}`);
            } else {
                addSuccess(name);
            }
        }

        function addFail(name, variable, className = "test") {
            const detail = normalizeError(variable);
            window.jatosTestResult.failed.push({ name, detail });
            if (detail) {
                $('body').append(`<p class="${className}">${name}: <font color="red">KO (${detail})</font></p>`);
            } else {
                $('body').append(`<p class="${className}">${name}: <font color="red">KO</font></p>`);
            }
        }

        function addSuccess(name, className = "test") {
            window.jatosTestResult.passed.push(name);
            $('body').append(`<p class="${className}">${name}: <font color="green">OK</font></p>`);
        }

        function normalizeError(error) {
            if (typeof error == 'undefined' || error === null) return "";
            if (error instanceof Error) return error.stack || error.message;
            if (typeof error == 'string') return error;
            try {
                return JSON.stringify(error);
            } catch (_) {
                return String(error);
            }
        }

        async function retry(fn, retries = 10) {
            let lastError;

            for (let i = 0; i < retries; i++) {
                try {
                    return await fn();
                } catch (error) {
                    lastError = error;
                    // Wait 1-2 s before next retry
                    const delay = (Math.random() + 1) * 1000;
                    console.log("Repeat " + i);
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }

            throw lastError;
        }

        // Runs the batch-session contract with retries to tolerate concurrent study runs.
        async function testBatchSession() {
            try {
                await retry(async () => { await testBatchSessionOnce() });
                addSuccess("jatos.batchSession");
            } catch (error) {
                addFail("jatos.batchSession - error: " + error);
            }
        }

        /*
         * Batch-session tests use async/await, while group-session tests use
         * Promise.then/catch to exercise both styles.
         *
         * Because multiple study runs may execute concurrently, the tests retry
         * operations affected by concurrent session updates. Disabling batch or group
         * session versioning generally permits race conditions; it is done briefly
         * below only to test the documented non-versioned behavior.
         */
        async function testBatchSessionOnce() {
            const srId = "srId_" + jatos.studyResultId;
            console.log(`${srId} batchSession start`);

            let onBatchSessionTest = false;
            jatos.onBatchSession((path) => {
                onBatchSessionTest = true;
            });

            try {
                // set
                console.log(`testBatchSession - jatos.batchSession.set(${srId}, "你经常来这吗")`);
                await jatos.batchSession.set(srId, "你经常来这吗");
                let test = jatos.batchSession.test(`/${srId}`, "你经常来这吗");
                testVarJson(test, "jatos.batchSession.set", "true", "notest");

                // set object
                console.log(`testBatchSession - jatos.batchSession.set(${srId}, { "a": "你经常来这吗", "a2": "foo2" }) - ${JSON.stringify(jatos.batchSession.get(srId))}`);
                await jatos.batchSession.set(srId, { "a": "你经常来这吗", "a2": "foo2" });
                test = jatos.batchSession.test(`/${srId}/a`, "你经常来这吗") && jatos.batchSession.test(`/${srId}/a2`, "foo2");
                testVarJson(test, "jatos.batchSession.set(object)", "true", "notest");

                // add
                console.log(`testBatchSession - jatos.batchSession.add("/${srId}/b", 123) - ${JSON.stringify(jatos.batchSession.get(srId))}`);
                await jatos.batchSession.add(`/${srId}/b`, 123);
                test = jatos.batchSession.test(`/${srId}/b`, 123);
                testVarJson(test, "jatos.batchSession.add", "true", "notest");

                // add object
                console.log(`testBatchSession - jatos.batchSession.add(/${srId}/obj, { foo: "bar" }) - ${JSON.stringify(jatos.batchSession.get(srId))}`);
                await jatos.batchSession.add(`/${srId}/obj`, { foo: "bar" });
                test = jatos.batchSession.test(`/${srId}/obj/foo`, "bar");
                testVarJson(test, "jatos.batchSession.add(object)", "true", "notest");

                // add array
                console.log(`testBatchSession - jatos.batchSession.add(/${srId}/array, [1, 2, 3]) - ${JSON.stringify(jatos.batchSession.get(srId))}`);
                await jatos.batchSession.add(`/${srId}/array`, [1, 2, 3]);
                const test1 = jatos.batchSession.test(`/${srId}/array/0`, 1);
                const test2 = jatos.batchSession.test(`/${srId}/array/1`, 2);
                const test3 = jatos.batchSession.test(`/${srId}/array/2`, 3);
                testVarJson(test1 && test2 && test3, "jatos.batchSession.add(array)", "true", "notest");

                // add an element to an existing array
                console.log(`testBatchSession - jatos.batchSession.add(/${srId}/array/2, "new") - ${JSON.stringify(jatos.batchSession.get(srId))}`);
                await jatos.batchSession.add(`/${srId}/array/2`, "new");
                test = jatos.batchSession.test(`/${srId}/array/2`, "new");
                testVarJson(test, "jatos.batchSession.add(add element to array)", "true", "notest");

                // add an element to the end of an existing array
                console.log(`testBatchSession - jatos.batchSession.add(/${srId}/array/-, "last") - ${JSON.stringify(jatos.batchSession.get(srId))}`);
                await jatos.batchSession.add(`/${srId}/array/-`, "last");
                test = jatos.batchSession.test(`/${srId}/array/4`, "last");
                testVarJson(test, "jatos.batchSession.add(add element to end of array)", "true", "notest");

                // get
                console.log(`testBatchSession - jatos.batchSession.get(${srId}) - ${JSON.stringify(jatos.batchSession.get(srId))}`);
                test = jatos.batchSession.get(srId);
                testVarJson(test, "jatos.batchSession.get", '{"a":"你经常来这吗","a2":"foo2","b":123,"obj":{"foo":"bar"},"array":[1,2,"new",3,"last"]}', "notest");

                // find
                console.log(`testBatchSession - jatos.batchSession.find(/${srId}/a) - ${JSON.stringify(jatos.batchSession.get(srId))}`);
                test = jatos.batchSession.find(`/${srId}/a`);
                testVarJson(test, "jatos.batchSession.find", '"你经常来这吗"', "notest");

                // defined
                console.log(`testBatchSession - jatos.batchSession.defined(/${srId}/a) - ${JSON.stringify(jatos.batchSession.get(srId))}`);
                test = jatos.batchSession.defined(`/${srId}/a`);
                testVarJson(test, "jatos.batchSession.defined", "true", "notest");

                // getAll
                console.log(`testBatchSession - jatos.batchSession.getAll() - ${srId} - ${JSON.stringify(jatos.batchSession.get(srId))}`);
                test = jatos.batchSession.getAll();
                testVarJson(test[srId], "jatos.batchSession.getAll", '{"a":"你经常来这吗","a2":"foo2","b":123,"obj":{"foo":"bar"},"array":[1,2,"new",3,"last"]}', "notest");

                // replace
                console.log(`testBatchSession - jatos.batchSession.replace(/${srId}/a, "bla") - ${JSON.stringify(jatos.batchSession.get(srId))}`);
                await jatos.batchSession.replace(`/${srId}/a`, "bla");
                test = jatos.batchSession.test(`/${srId}/a`, "bla");
                testVarJson(test, "jatos.batchSession.replace", "true", "notest");

                // copy
                console.log(`testBatchSession - jatos.batchSession.copy(/${srId}/a, /${srId}/c) - ${JSON.stringify(jatos.batchSession.get(srId))}`);
                await jatos.batchSession.copy(`/${srId}/a`, `/${srId}/c`);
                test = jatos.batchSession.test(`/${srId}/a`, "bla") && jatos.batchSession.test(`/${srId}/c`, "bla");
                testVarJson(test, "jatos.batchSession.copy", "true", "notest");

                // move
                console.log(`testBatchSession - jatos.batchSession.move(/${srId}/c, /${srId}/d) - ${JSON.stringify(jatos.batchSession.get(srId))}`);
                await jatos.batchSession.move(`/${srId}/c`, `/${srId}/d`);
                test = !jatos.batchSession.defined(`/${srId}/c`) && jatos.batchSession.test(`/${srId}/d`, "bla");
                testVarJson(test, "jatos.batchSession.move", "true", "notest");

                // remove
                console.log(`testBatchSession - jatos.batchSession.remove(/${srId}/d) - ${JSON.stringify(jatos.batchSession.get(srId))}`);
                await jatos.batchSession.remove(`/${srId}/d`);
                test = jatos.batchSession.defined(`/${srId}/d`);
                testVarJson(test, "jatos.batchSession.remove", "false", "notest");

                await testBatchSessionVersioning();

                testVarJson(onBatchSessionTest, "jatos.onBatchSession", "true", "notest");

            } finally {
                // Clean up
                console.log(`testBatchSession - jatos.batchSession.remove(/${srId})`);
                await jatos.batchSession.remove(`/${srId}`);
            }
        }

        // Checks concurrent updates with batch-session versioning off and on.
        async function testBatchSessionVersioning() {
            const srId = "srId_" + jatos.studyResultId;

            jatos.batchSessionVersioning = false;
            const promise1 = jatos.batchSession.add(`/${srId}/1`, "one");
            const promise2 = jatos.batchSession.add(`/${srId}/2`, "two");
            const promise3 = jatos.batchSession.add(`/${srId}/3`, "three");
            await Promise.all([promise1, promise2, promise3]);
            addSuccess("jatos.batchSessionVersioning(off)", "notest");

            jatos.batchSessionVersioning = true;
            const promise4 = jatos.batchSession.add(`/${srId}/4`, "four");
            const promise5 = jatos.batchSession.add(`/${srId}/5`, "five");
            // The promise must fail now since we send 2 updates simultaneously and versioning is on
            await Promise.allSettled([promise4, promise5])
                .then((results) => {
                    // console.log(results);
                    const rejectedResults = results.filter((result) => result.status === "rejected");
                    if (rejectedResults.length > 0) {
                        addSuccess("jatos.batchSessionVersioning (on)", "notest");
                    } else {
                        throw "Simultaneous batch session updates with batchSessionVersioning = true must fail";
                    }
                });

            await jatos.batchSession.add(`/${srId}/afterConflict`, "works");
            testVar(jatos.batchSession.test(`/${srId}/afterConflict`, "works"),
                "jatos.batchSession usable after version conflict", true);

        // Checks concurrent updates and recovery for group-session versioning.
        async function testGroupSessionVersioning() {
            jatos.groupSessionVersioning = false;
            const promise1 = jatos.groupSession.add("/1_" + jatos.studyResultId, "one");
            const promise2 = jatos.groupSession.add("/2_" + jatos.studyResultId, "two");
            const promise3 = jatos.groupSession.add("/3_" + jatos.studyResultId, "three");
            await Promise.all([promise1, promise2, promise3]);
            addSuccess("jatos.groupSessionVersioning (off)", "notest");

            jatos.groupSessionVersioning = true;
            const promise4 = jatos.groupSession.add("/4_" + jatos.studyResultId, "four");
            const promise5 = jatos.groupSession.add("/5_" + jatos.studyResultId, "five");
            // The promise must fail now since we send 2 updates simultaneously and versioning is on
            await Promise.allSettled([promise4, promise5])
                .then((results) => {
                    // console.log(results);
                    const rejectedResults = results.filter((result) => result.status === "rejected");
                    if (rejectedResults.length > 0) {
                        addSuccess("jatos.groupSessionVersioning (on)", "notest");
                    } else {
                        throw "Simultaneous batch session updates with groupSessionVersioning is true must fail";
                    }
                });

            await jatos.groupSession.set("afterConflict_" + jatos.studyResultId, "works");
            testVar(jatos.groupSession.test("/afterConflict_" + jatos.studyResultId, "works"),
                "jatos.groupSession usable after version conflict", true);
        }

        // Freezes the jQuery-style promise surface and callback timing.
        async function testLegacyPromiseContract() {
            const events = [];
            const result = jatos.appendResultData(" ... legacy promise contract");

            testVar(typeof result.promise, "result promise has promise", "function");
            testVar(typeof result.then, "result promise has then", "function");
            testVar(typeof result.catch, "result promise has catch", "function");
            testVar(typeof result.done, "result promise has done", "function");
            testVar(typeof result.fail, "result promise has fail", "function");
            testVar(typeof result.always, "result promise has always", "function");
            testVar(typeof result.state, "result promise has state", "function");
            testVar(typeof result.resolve, "result promise hides resolve", "undefined");
            testVar(typeof result.reject, "result promise hides reject", "undefined");
            testVar(result.promise() === result, "result promise returns itself", true);
            testVar(result.state(), "result promise initially pending", "pending");

            let doneArgs;
            const doneReturn = result.done((...args) => {
                doneArgs = args;
                events.push("done-1");
            });
            const alwaysReturn = result.always(() => events.push("always"));
            const secondDoneReturn = result.done(() => events.push("done-2"));
            const failReturn = result.fail(() => events.push("fail"));
            const transformed = result.then(() => "transformed");

            testVar(doneReturn === result, "done returns the same promise", true);
            testVar(alwaysReturn === result, "always returns the same promise", true);
            testVar(secondDoneReturn === result, "multiple done handlers return the same promise", true);
            testVar(failReturn === result, "fail returns the same promise", true);
            testVar(typeof transformed.done, "then returns a legacy promise", "function");
            await result;

            testVar(result.state(), "result promise eventually resolved", "resolved");
            testVarJson(events, "legacy promise success callback order",
                '["done-1","always","done-2"]');
            testVarJson(doneArgs, "legacy promise success callback arguments", '[]');
            testVar(await transformed, "then transforms a resolved value", "transformed");

            let lateDoneCalled = false;
            const lateDoneReturn = result.done(() => { lateDoneCalled = true; });
            testVar(lateDoneCalled, "done handler added after resolution is synchronous", true);
            testVar(lateDoneReturn === result, "late done returns the same promise", true);
        }

        // Ensures callback and Promise success notifications each occur exactly once.
        async function testSuccessCallbackContract() {
            let successCallbackCount = 0;
            let promiseResolutionCount = 0;
            const result = jatos.appendResultData(
                " ... success callback contract",
                () => { successCallbackCount++; },
                error => addFail("appendResultData unexpected error callback", error)
            );

            await result.then(() => { promiseResolutionCount++; });
            testVar(successCallbackCount,
                "appendResultData success callback called once", 1);
            testVar(promiseResolutionCount,
                "appendResultData promise resolved once", 1);
        }

        // Freezes rejection state, callback order, and late-handler behavior.
        async function testFailureContract() {
            const events = [];
            const filename = `missing-${jatos.studyResultId}-${Date.now()}.txt`;
            const result = jatos.downloadResultFile(
                filename,
                () => events.push("onSuccess"),
                () => events.push("onError")
            );

            testVar(typeof result.fail, "failed result promise has fail", "function");
            testVar(typeof result.always, "failed result promise has always", "function");
            testVar(typeof result.state, "failed result promise has state", "function");
            let failArgs;
            const failReturn = result.fail((...args) => {
                failArgs = args;
                events.push("fail-1");
            });
            const alwaysReturn = result.always(() => events.push("always"));
            const secondFailReturn = result.fail(() => events.push("fail-2"));
            const doneReturn = result.done(() => events.push("done"));
            const recovered = result.catch(() => "recovered");

            testVar(failReturn === result, "failed promise fail returns itself", true);
            testVar(alwaysReturn === result, "failed promise always returns itself", true);
            testVar(secondFailReturn === result, "multiple fail handlers return the same promise", true);
            testVar(doneReturn === result, "failed promise done returns itself", true);
            testVar(typeof recovered.fail, "catch returns a legacy promise", "function");

            try {
                await result;
                addFail("missing result file rejects", "Promise resolved unexpectedly");
            } catch (_) {
                addSuccess("missing result file rejects");
            }

            testVar(result.state(), "failed result promise eventually rejected", "rejected");
            testVarJson(events, "legacy promise failure callback order",
                '["onError","fail-1","always","fail-2"]');
            testVar(failArgs.length, "legacy promise failure callback argument count", 1);
            testVar(await recovered, "catch transforms a rejected value", "recovered");

            let lateFailCalled = false;
            const lateFailReturn = result.fail(() => { lateFailCalled = true; });
            testVar(lateFailCalled, "fail handler added after rejection is synchronous", true);
            testVar(lateFailReturn === result, "late fail returns the same promise", true);
        }

            return Promise.all([promise1, promise2, promise3, promise4, promise5, promise6, promise7, promise8, promise9, promise10, promise11])

                .catch(() => addFail("jatos.appendResultData"));
        }

        // Exercises concurrent transmission of several large result-data payloads.
        function testAppendLargeResultData() {
            let promises = [];
            for (let i = 0; i < 10; i++) {
                promises.push(jatos.appendResultData("\n ... append large " + i + " - " + generateRandomString(50000))); // Should be shown in a new line with a random string of 5000 chars
            }
            return Promise.all(promises)
                .then(() => addSuccess("jatos.appendLargeResultData"))
                .catch(() => addFail("jatos.appendLargeResultData"));
        }

        function generateRandomString(length) {
            const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            return Array.apply(null, Array(length)).map(function () { return chars.charAt(Math.floor(Math.random() * chars.length)); }).join('');
        }
