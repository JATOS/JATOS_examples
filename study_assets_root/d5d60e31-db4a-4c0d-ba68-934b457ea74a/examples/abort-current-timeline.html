<!DOCTYPE html>
<html>
  <head>
    <script src="jatos.js"></script>
    <script src="dist/jspsych.js"></script>
    <script src="dist/plugin-html-keyboard-response.js"></script>
    <script src="dist/plugin-image-keyboard-response.js"></script>
    <script src="dist/plugin-preload.js"></script>
    <link rel="stylesheet" href="dist/jspsych.css" />
  </head>
  <body></body>
  <script>

    var jsPsych = initJsPsych({
      on_finish: function () {
        jatos.startNextComponent(jsPsych.data.get().json());
      }
    });

    var images = ["examples/img/1.gif", "examples/img/2.gif", "examples/img/3.gif", "examples/img/4.gif", "examples/img/5.gif", "examples/img/6.gif", "examples/img/7.gif", "examples/img/8.gif", "examples/img/9.gif", "examples/img/10.gif"];

    var trials = [];
    for (var i = 0; i < images.length; i++) {
      trials.push({
        stimulus: images[i]
      });
    }

    var preload = {
      type: jsPsychPreload,
      auto_preload: true
    };

    var block = {
      type: jsPsychImageKeyboardResponse,
      choices: ['y','n'],
      stimulus_width: 300,
      prompt: '<p>Press "y" to continue. Press "n" to end this node of the experiment.</p>',
      on_finish: function(data) {
        if (jsPsych.pluginAPI.compareKeys(data.response, "n")) {
          jsPsych.abortCurrentTimeline();
        }
      },
      timeline: trials
    };

    var after_block = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '<p>The next node.</p><p>Press any key to finish.</p>',
    };

    jatos.onLoad(() => {
      jsPsych.run([preload, block, after_block]);
    });

  </script>
</html>
