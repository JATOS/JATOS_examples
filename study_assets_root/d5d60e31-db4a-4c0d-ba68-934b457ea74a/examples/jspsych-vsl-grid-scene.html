<!DOCTYPE html>
<html>
  <head>
    <script src="jatos.js"></script>
    <script src="dist/jspsych.js"></script>
    <script src="dist/plugin-vsl-grid-scene.js"></script>
    <script src="dist/plugin-html-keyboard-response.js"></script>
    <script src="dist/plugin-preload.js"></script>
    <link rel="stylesheet" href="dist/jspsych.css">
  </head>
  <body></body>
  <script>

    var jsPsych = initJsPsych({
      on_finish: function() {
        jatos.startNextComponent(jsPsych.data.get().json());
      }
    });

    var images = ["examples/img/1.gif","examples/img/2.gif","examples/img/3.gif","examples/img/4.gif","examples/img/5.gif","examples/img/6.gif","examples/img/7.gif","examples/img/8.gif","examples/img/9.gif","examples/img/10.gif"];

    var preload = {
      type: jsPsychPreload,
      auto_preload: true
    };

    var scene =
      [
        [0,"examples/img/8.gif","examples/img/9.gif",0,0],
        ["examples/img/1.gif", "examples/img/2.gif", 0, 0,0],
        [ 0, "examples/img/3.gif", 0, 0, 0],
        ["examples/img/5.gif", "examples/img/4.gif", 0, 0, 0],
        [0,0,0,0,0]
      ];

    var trial = {
      type: jsPsychVslGridScene,
      stimuli: scene,
      image_size: [50,50]
    };

    var trial_2 = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: function() {
        return jsPsychVslGridScene.generate_stimulus(scene, [100,100]);
      }
    };

    jatos.onLoad(() => {
      jsPsych.run([preload, trial, trial_2]);
    });

  </script>
</html>
