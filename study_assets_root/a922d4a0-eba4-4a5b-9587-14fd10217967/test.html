<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="jatos.js"></script>
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f6f7fb;
            color: #1f2937;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 10px 14px;
            background: #2563eb;
            color: white;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
        }

        button:hover {
            background: #1d4ed8;
        }

        button.secondary {
            background: #6b7280;
        }

        button.secondary:hover {
            background: #4b5563;
        }

        #output {
            display: grid;
            gap: 16px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(148, 163, 184, 0.25);
        }

        .card h3 {
            margin: 0 0 10px;
            font-size: 16px;
        }

        .meta {
            margin: 0 0 12px;
            color: #6b7280;
            font-size: 13px;
        }

        pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            font-size: 14px;
            line-height: 1.5;
            background: #0f172a;
            color: #e2e8f0;
            padding: 14px;
            border-radius: 12px;
            overflow: auto;
        }

        img {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.25);
        }

        audio {
            width: 100%;
            margin-top: 10px;
        }

        .error {
            color: #b91c1c;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="toolbar">
        <button onclick="runText()">Generate text</button>
        <button onclick="speech()">Audio/speech</button>
        <button onclick="generateImage()">Image generation</button>
        <button class="secondary" onclick="clearOutput()">Clear</button>
        <button class="secondary" onclick="jatos.endStudy()">jatos.endStudy</button>
    </div>

    <div id="output"></div>

    <script>
        const output = document.getElementById('output');

        jatos.onLoad(async function () {
            await runText();
        });

        function clearOutput() {
            output.innerHTML = '';
        }

        function showCard(title, contentHtml, meta = '') {
            const card = document.createElement('section');
            card.className = 'card';
            card.innerHTML = `
                <h3>${title}</h3>
                ${meta ? `<div class="meta">${meta}</div>` : ''}
                ${contentHtml}
            `;
            output.prepend(card);
            return card;
        }

        function showText(title, text, meta = '') {
            const safeText = typeof text === 'string' ? text : JSON.stringify(text, null, 2);
            showCard(title, `<pre>${escapeHtml(safeText)}</pre>`, meta);
        }

        function showImage(title, imageUrl, meta = '') {
            showCard(
                title,
                `<img src="${imageUrl}" alt="${escapeHtml(title)}">`,
                meta
            );
        }

        function showAudio(title, audioUrl, meta = '') {
            showCard(
                title,
                `<audio controls autoplay src="${audioUrl}"></audio>`,
                meta
            );
        }

        function showError(message) {
            showCard('Error', `<div class="error">${escapeHtml(message)}</div>`);
        }

        function escapeHtml(value) {
            return value
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        async function runText() {
            const result = await callOpenAiProxy('responses', {
                model: "gpt-4.1-mini",
                input: "Write a short, friendly greeting."
            });

            if (result == null) {
                showError('No response received.');
                return;
            }

            // Try to display nicely whether the proxy returns JSON or plain text.
            if (typeof result === 'string') {
                showText('Text response', result, 'OpenAI output');
                return;
            }

            const pretty = JSON.stringify(result, null, 2);
            showText('JSON response', pretty, 'OpenAI output');
        }

        async function speech() {
            const audioBlob = await callOpenAiProxy('audio/speech', {
                model: "tts-1",
                input: "Welcome to the study.",
                voice: "alloy"
            });

            if (!audioBlob) {
                showError('No audio received.');
                return;
            }

            const audioUrl = URL.createObjectURL(audioBlob);
            showAudio('Speech', audioUrl, 'Text-to-speech output');
        }

        async function generateImage() {
            const response = await callOpenAiProxy('images/generations', {
                model: "dall-e-3",
                prompt: "A sunset over a futuristic city",
                n: 1,
                size: "1024x1024",
                response_format: "b64_json"
            });

            const b64Data = response?.data?.[0]?.b64_json;
            if (!b64Data) {
                showError('No image data received.');
                return;
            }

            const blob = await (await fetch(`data:image/png;base64,${b64Data}`)).blob();
            const imageUrl = URL.createObjectURL(blob);
            showImage('Generated image', imageUrl, 'OpenAI image output');
        }

        async function callOpenAiProxy(path, data) {
            const url = `/publix/api/v1/studyResults/${jatos.studyResultUuid}/openai/${path}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const contentType = response.headers.get("content-type") || "";

                if (contentType.includes("application/json")) {
                    const json = await response.json();
                    if (!response.ok) {
                        throw new Error(json?.error?.message || JSON.stringify(json.error || json));
                    }
                    return json;
                }

                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                if (contentType.includes("audio") || contentType.includes("image")) {
                    return await response.blob();
                }

                return await response.text();
            } catch (error) {
                console.error("Network or Parsing Error:", error);
                showError(error.message || String(error));
                return null;
            }
        }
    </script>
</body>
</html>
